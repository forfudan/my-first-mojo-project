name: Unit Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: "Test: ${{ matrix.folder }}"
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: [move, basic, advanced, extend]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.5

      - name: Show environment
        run: |
          eval "$(pixi shell-hook --shell bash)"
          echo "Mojo:   $(mojo --version)"
          echo "Python: $(python --version)"

      - name: "Run tests in src/${{ matrix.folder }}"
        run: |
          eval "$(pixi shell-hook --shell bash)"
          bash .github/scripts/run_folder_tests.sh "src/${{ matrix.folder }}"
